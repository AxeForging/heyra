substitutions:
  room: unset
  device_name: unset
  friendly_name: unset
  unit_id: "0"
  static_ip: 192.168.1.100
  gateway_ip: 192.168.1.1
  subnet_mask: 255.255.255.0
  server_ip: 192.168.1.228
  server_port: "6969"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway_ip}
    subnet: ${subnet_mask}
  ap:
    ssid: "${device_name}-fallback"
    password: !secret wifi_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: play_alert
      variables:
        tone_id: int
      then:
        - lambda: 'id(streamer).play_alert(tone_id);'

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      # Resolved relative to the top-level invoked YAML (units/atom-echo-NN.yaml), not
      # this file -- hence the ../ even though this file lives next to components/.
      path: ../components
    components: [udp_audio_streamer]

udp_audio_streamer:
  id: streamer
  unit_id: ${unit_id}
  microphone_id: mic
  speaker_id: spk
  server_ip: ${server_ip}
  server_port: ${server_port}

switch:
  - platform: template
    name: "Streaming"
    id: streaming_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: false
    lambda: 'return id(streamer).get_streaming();'
    turn_on_action:
      - lambda: 'id(streamer).set_streaming(true);'
    turn_off_action:
      - lambda: 'id(streamer).set_streaming(false);'

binary_sensor:
  - platform: template
    name: "Smoke Alarm Detected"
    id: smoke_alarm_detected
    device_class: smoke
    # template binary_sensor re-evaluates its lambda every main loop() tick already --
    # no update_interval option exists for this platform (that's a sensor:-only option).
    lambda: 'return id(streamer).is_smoke_alarm_detected();'
    on_press:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          effect: Strobe
    on_release:
      - light.turn_off: status_led
