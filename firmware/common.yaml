substitutions:
  room: unset
  device_name: unset
  friendly_name: unset
  unit_id: "0"
  static_ip: 192.168.1.100
  gateway_ip: 192.168.1.1
  subnet_mask: 255.255.255.0
  server_ip: 192.168.1.228
  server_port: "6969"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway_ip}
    subnet: ${subnet_mask}
  ap:
    ssid: "${device_name}-fallback"
    password: !secret wifi_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: play_alert
      variables:
        tone_id: int
      then:
        - lambda: 'id(streamer).play_alert(tone_id);'

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      # Resolved relative to the top-level invoked YAML (units/atom-echo-NN.yaml), not
      # this file -- hence the ../ even though this file lives next to components/.
      path: ../components
    components: [udp_audio_streamer]

i2s_audio:
  id: i2s_bus
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO23
    sample_rate: 16000
    bits_per_sample: 16bit
    # "mono" is rejected for i2s_audio microphones -- right == mono PDM capture (schema default).
    channel: right

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO22
    i2s_mode: primary
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

udp_audio_streamer:
  id: streamer
  unit_id: ${unit_id}
  microphone_id: mic
  speaker_id: spk
  server_ip: ${server_ip}
  server_port: ${server_port}

switch:
  - platform: template
    name: "Streaming"
    id: streaming_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: false
    lambda: 'return id(streamer).get_streaming();'
    turn_on_action:
      - lambda: 'id(streamer).set_streaming(true);'
    turn_off_action:
      - lambda: 'id(streamer).set_streaming(false);'

binary_sensor:
  - platform: template
    name: "Smoke Alarm Detected"
    id: smoke_alarm_detected
    device_class: smoke
    # template binary_sensor re-evaluates its lambda every main loop() tick already --
    # no update_interval option exists for this platform (that's a sensor:-only option).
    lambda: 'return id(streamer).is_smoke_alarm_detected();'
    on_press:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          effect: Strobe
    on_release:
      - light.turn_off: status_led

  - platform: gpio
    id: button
    name: "Button"
    # GPIO39 has no internal pull -- relies on the M5Stack board-level pull-up.
    pin:
      number: GPIO39
      inverted: true
      mode: INPUT
    on_click:
      - min_length: 30ms
        max_length: 400ms
        then:
          - homeassistant.event:
              event: esphome.button_ack
              data:
                unit_id: "${unit_id}"
                room: "${room}"
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - switch.toggle: streaming_switch

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    effects:
      - strobe:
          name: Strobe
