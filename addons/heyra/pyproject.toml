[project]
name = "heyra"
version = "0.3.2"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",  # newer numpy 2.x breaks tflite-runtime's compiled ABI (predates numpy 2.0) -- verified
    "scipy==1.16.2",
    "scikit-learn==1.9.0",
    "tflite-runtime==2.14.0",
    "onnxruntime==1.28.0",
    "openwakeword==0.6.0",
    "aiomqtt==2.5.1",
    "PyYAML==6.0.3",
    "tqdm==4.70.0",
    "requests==2.34.2",
    # Ingress web app (status + flashing wizard). Pinned below esphome's own platformio
    # dependency's caps (starlette<0.53, uvicorn<0.41) -- esphome lives in its own venv
    # at build time (see Dockerfile), but these are still pinned to match it since the
    # flashing subprocess calls assume the same behavior was tested against.
    "starlette==0.52.1",
    "uvicorn==0.40.0",
    # request.form() needs this to parse the flash wizard's multipart/form-data POST --
    # without it Starlette raises before any board validation runs (a real, silent 500).
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["listener*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["listener/tests", "test_render_config.py", "test_main.py", "test_run.py"]
