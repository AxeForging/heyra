[project]
name = "heyra"
version = "0.5.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",  # newer numpy 2.x breaks tflite-runtime's compiled ABI (predates numpy 2.0) -- verified
    "scipy==1.16.2",
    "scikit-learn==1.9.0",
    "tflite-runtime==2.14.0",
    "onnxruntime==1.28.0",
    "openwakeword==0.6.0",
    "aiomqtt==2.5.1",
    "PyYAML==6.0.3",
    "tqdm==4.70.0",
    "requests==2.34.2",
    # Ingress web app (device status view + the /assign form below).
    "starlette==0.52.1",
    "uvicorn==0.40.0",
    # Starlette 0.52's form parsing (both urlencoded and multipart) needs this to even
    # import -- confirmed by reading formparsers.py directly this time, not assumed
    # (this exact gap caused a real 500 earlier in this project's own flash form).
    "python-multipart==0.0.20",
    # mDNS discovery for the unit_id-assignment feature -- pinned to match the version
    # esphome itself currently pulls (real, confirmed installed elsewhere in this repo).
    "zeroconf==0.150.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["listener*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["listener/tests", "test_render_config.py", "test_main.py", "test_run.py", "test_discovery.py"]
