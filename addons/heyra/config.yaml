name: Heyra
version: "0.3.0"
slug: heyra
description: Smoke alarm, baby cry, glass break, and doorbell detection for Home Assistant via sound -- plus USB firmware flashing. By AxeForging.
url: https://github.com/AxeForging/heyra
image: ghcr.io/axeforging/heyra
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
uart: true
host_network: true
hassio_api: true
ingress: true
ingress_port: 0
panel_icon: mdi:ear-hearing
panel_title: Heyra
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  units:
    - unit_id: 1
      room: kitchen
schema:
  units:
    - unit_id: int
      room: str
