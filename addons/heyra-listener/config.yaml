name: Heyra Listener
version: "0.1.0"
slug: heyra-listener
description: Acoustic event detection (YAMNet + openWakeWord) for the Heyra ATOM Echo mesh, by AxeForging
url: https://github.com/AxeForging/heyra
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
ports:
  6969/udp: 6969
  8080/tcp: 8080
ports_description:
  6969/udp: Raw PCM audio ingest from Heyra firmware units
  8080/tcp: /healthz status endpoint
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  units:
    - unit_id: 1
      room: kitchen
schema:
  units:
    - unit_id: int
      room: str
