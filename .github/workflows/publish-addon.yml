name: Publish Add-on Image

# Ships addons/heyra as a prebuilt multi-arch image instead of Supervisor building it
# from source on every install -- that was hanging/very slow on Pi-class hardware
# compiling numpy/scipy/tflite-runtime/onnxruntime/esphome from scratch. Pattern
# confirmed against the real ESPHome Add-on's own release workflow (push-by-digest
# per arch, native ARM runner -- no QEMU -- then stitch a real multi-arch manifest
# with buildx imagetools), not the deprecated home-assistant/builder action.

on:
  push:
    branches: [master]
    paths:
      - 'addons/heyra/**'
      - '.github/workflows/publish-addon.yml'
  workflow_dispatch:

concurrency:
  group: publish-addon-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/axeforging/heyra

jobs:
  read-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          version=$(grep '^version:' addons/heyra/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: read-version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: addons/heyra
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [read-version, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ needs.read-version.outputs.version }} \
            -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Verify manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ needs.read-version.outputs.version }}
