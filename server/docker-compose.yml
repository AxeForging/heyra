services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: unless-stopped

  listener:
    # Source of truth moved to addons/heyra/ (same image also ships as the merged
    # Heyra HA Add-on -- listener + USB flashing wizard). This compose file is kept
    # for non-HA users who just want the raw service.
    build: ../addons/heyra
    depends_on:
      - mosquitto
    ports:
      - "6969:6969/udp"
      - "8080:8080"
      - "8099:8099"  # ingress web app (status + flashing wizard), no HA Ingress proxy here
    volumes:
      # Mounted at the same /config/config.yaml path the Add-on's addon_config
      # map uses (see render_config.py) -- full replacement of the template,
      # not a merge, lets local dev tune events without a rebuild.
      - ../addons/heyra/listener/config.yaml:/config/config.yaml:ro
      - ../addons/heyra/models:/app/models:ro
      - listener-debug:/app/debug
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mosquitto-data: {}
  mosquitto-log: {}
  listener-debug: {}
